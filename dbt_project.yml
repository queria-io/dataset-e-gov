name: "e_gov"
version: "1.0.0"

profile: "e_gov"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  e_gov:
    +database: e_gov
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    laws:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
