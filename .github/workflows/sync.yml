name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 法令データは公布・施行のたびに更新される。毎週月曜 04:00 JST に取る
    - cron: "0 19 * * 0"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@4008bbec3bf8c5aad513b18c018b14d077e92920
    with:
      dataset_name: e_gov
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
